name: Tester l'appli en conditions réelles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 1 && node tools/test-reel.js /tmp/captures
      - name: Publier les captures sur la branche ci-captures
        if: always()
        run: |
          cd /tmp/captures 2>/dev/null || exit 0
          git init -q -b ci-captures && git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Captures du test réel ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-captures
